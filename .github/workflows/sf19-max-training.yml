name: Stockfish 19 MAX training batch

on:
  # Push to this experiment branch launches the quality-controlled 10+0 batch.
  # The path filter prevents later data/report commits from starting another run.
  push:
    branches:
      - feature/nextgen-memory-extension-2026-10-31
    paths:
      - '.github/workflows/sf19-max-training.yml'
  workflow_dispatch:
    inputs:
      games:
        description: "Number of true 10+0 quality games"
        type: choice
        required: true
        default: "12"
        options:
          - "8"
          - "10"
          - "12"

permissions:
  contents: write

concurrency:
  group: nextgen-sf19-max-training-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools and chess tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake
          python -m pip install --upgrade pip
          python -m pip install python-chess numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python tests/test_nnue_teacher_export.py
          python -m py_compile tools/label_teacher_positions.py tools/validate_nnue_candidate.py training/train_nnue_teacher.py

      - name: Build and run correctness tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          mkdir -p bin
          cp build/chess_engine bin/chess_engine

      - name: Download official Stockfish 19 universal binary
        run: |
          mkdir -p /tmp/sf19
          curl --fail --location --retry 3 \
            https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz \
            --output /tmp/stockfish19.tar.gz
          tar -xzf /tmp/stockfish19.tar.gz -C /tmp/sf19 --strip-components=1
          STOCKFISH_BIN="$(find /tmp/sf19 -type f -name 'stockfish*' -perm /111 | head -n 1)"
          test -n "$STOCKFISH_BIN"
          ln -sf "$STOCKFISH_BIN" /tmp/sf19/stockfish19
          find /tmp/sf19 -type f -name '*.nnue' -exec cp -f {} . \;
          chmod +x /tmp/sf19/stockfish19
          /tmp/sf19/stockfish19 <<'EOF'
          uci
          quit
          EOF

      - name: Play paired-color games at a genuine 10+0 time control
        id: collect_games
        env:
          GAMES: ${{ inputs.games || '12' }}
        run: |
          QUALITY_DIR=datasets/quality_sf19_10plus0/run-${GITHUB_RUN_ID}
          mkdir -p "$QUALITY_DIR"
          python tools/clock_match.py \
            --games "$GAMES" \
            --tc 600+0 \
            --sf-elo 0 \
            --tag "quality-10plus0-depth20-${GITHUB_RUN_ID}" \
            --hash-mb 256 \
            --jsonl "$QUALITY_DIR/games.jsonl" \
            --pgn "$QUALITY_DIR/games.pgn" \
            --summary "$QUALITY_DIR/match_summary.json"

      - name: Build depth-20/24/28 Stockfish teacher labels
        id: label_teacher
        run: |
          QUALITY_DIR=datasets/quality_sf19_10plus0/run-${GITHUB_RUN_ID}
          touch "$QUALITY_DIR/missed_positions.jsonl"
          python tools/label_teacher_positions.py \
            --pgn "$QUALITY_DIR/games.pgn" \
            --missed "$QUALITY_DIR/missed_positions.jsonl" \
            --stockfish /tmp/sf19/stockfish19 \
            --out "$QUALITY_DIR/teacher_eval_positions.jsonl" \
            --sample-every-plies 3 \
            --max-positions 240 \
            --depth 20 \
            --critical-count 48 \
            --critical-depth 24 \
            --elite-count 12 \
            --elite-depth 28 \
            --bulk-time-limit 5 \
            --critical-time-limit 12 \
            --elite-time-limit 25 \
            --seed 20261031

      - name: Train candidate NNUE from balanced teacher labels
        id: train_nnue
        run: |
          python training/train_nnue_teacher.py \
            --dataset datasets/quality_sf19_10plus0/teacher_eval_positions.jsonl \
            --out /tmp/nextgen_candidate.pt \
            --report /tmp/nextgen_candidate_training_report.json \
            --epochs 24 \
            --patience 5 \
            --batch 128 \
            --threads 2 \
            --cpu
          test -s /tmp/nextgen_candidate.nnue
          mkdir -p networks/candidates
          cp /tmp/nextgen_candidate.nnue "networks/candidates/nextgen-sf19-${GITHUB_RUN_ID}.nnue"
          cp /tmp/nextgen_candidate_training_report.json "networks/candidates/nextgen-sf19-${GITHUB_RUN_ID}-training-report.json"

      - name: Smoke-test candidate network
        id: smoke
        run: |
          set -o pipefail
          printf 'uci\nsetoption name NNUEFile value /tmp/nextgen_candidate.nnue\nsetoption name NNUEBlend value 30\nisready\nposition startpos\ngo depth 6\nquit\n' \
            | ./bin/chess_engine | tee /tmp/nextgen-nnue-smoke.txt
          grep -F 'NNUEFile loaded /tmp/nextgen_candidate.nnue' /tmp/nextgen-nnue-smoke.txt
          grep -E '^bestmove [a-h][1-8][a-h][1-8]' /tmp/nextgen-nnue-smoke.txt

      - name: Keep candidate isolated pending independent 10+0 validation
        id: hold_candidate
        run: |
          CANDIDATE="networks/candidates/nextgen-sf19-${GITHUB_RUN_ID}.nnue"
          test -s "$CANDIDATE"
          echo "Candidate retained separately; production networks/nnue.nnue is unchanged."
          echo "A short movetime gate is not accepted as evidence for promotion."

      - name: Summarize candidate result
        if: always()
        run: |
          if [ -s "networks/candidates/nextgen-sf19-${GITHUB_RUN_ID}.nnue" ]; then
            echo "## Stockfish teacher candidate: trained, not promoted" >> "$GITHUB_STEP_SUMMARY"
            echo "Match data uses paired-color 10+0 games against uncapped Stockfish 19 MAX." >> "$GITHUB_STEP_SUMMARY"
            echo "Teacher targets request depths 20, 24 and 28 with explicit wall-time caps; actual depths are recorded." >> "$GITHUB_STEP_SUMMARY"
            echo "The candidate is kept separate. Production NNUE promotion requires a separate independent 10+0 validation." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Stockfish teacher candidate: not produced" >> "$GITHUB_STEP_SUMMARY"
            echo "The run did not produce a candidate network. Existing production NNUE remains unchanged." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Persist quality match data, teacher labels and candidate without promotion
        if: always() && steps.collect_games.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          QUALITY_DIR=datasets/quality_sf19_10plus0/run-${GITHUB_RUN_ID}
          if [ -d "$QUALITY_DIR" ]; then git add "$QUALITY_DIR"; fi
          CANDIDATE="networks/candidates/nextgen-sf19-${GITHUB_RUN_ID}.nnue"
          REPORT="networks/candidates/nextgen-sf19-${GITHUB_RUN_ID}-training-report.json"
          if [ -f "$REPORT" ]; then git add "$REPORT"; fi
          if [ -f "$CANDIDATE" ]; then git add -f "$CANDIDATE"; fi
          if git diff --cached --quiet; then
            echo "No quality data or candidate changes to commit."
          else
            git commit -m "train: add isolated 10+0 Stockfish teacher dataset"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload teacher data, candidate NNUE, and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextgen-sf19-quality-10plus0-${{ inputs.games || '12' }}-games
          if-no-files-found: warn
          retention-days: 30
          path: |
            datasets/quality_sf19_10plus0/${{ github.run_id }}/
            networks/candidates/nextgen-sf19-${{ github.run_id }}.nnue
            networks/candidates/nextgen-sf19-${{ github.run_id }}-training-report.json
