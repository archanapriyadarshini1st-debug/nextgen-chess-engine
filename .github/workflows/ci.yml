
name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Configure sanitizer build
        run: >
          cmake -S . -B build-sanitize
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTS=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build sanitizer tests
        run: cmake --build build-sanitize --parallel 2
      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ctest --test-dir build-sanitize --output-on-failure

      - name: Test Python clock-match and weakness-audit tools
        run: |
          python -m pip install --disable-pip-version-check python-chess
          python -m py_compile tools/clock_match.py tools/analyze_engine_weakness.py tests/test_engine_weakness_audit.py
          python tests/test_engine_weakness_audit.py
