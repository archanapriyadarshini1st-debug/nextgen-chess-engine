name: Cute Chess Elo benchmark

on:
  workflow_dispatch:
    inputs:
      games:
        description: "Number of games (must be even for colour balance)"
        type: choice
        required: true
        default: "20"
        options: ["20", "40"]
      tc:
        description: "Cute Chess time control in seconds (600+0 = 10 minutes per side)"
        type: choice
        required: true
        default: "600+0"
        options: ["600+0", "300+2"]
      sf_elo:
        description: "Stockfish 19 UCI_Elo calibration level"
        type: choice
        required: true
        default: "1320"
        options: ["1320", "1400", "1600", "1800", "2000"]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4

      - name: Install build and Cute Chess tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3-pip curl
          curl --fail --location --retry 3 \
            https://github.com/cutechess/cutechess/releases/download/v1.5.1/Cute_Chess-1.5.1-x86_64.AppImage \
            --output /tmp/cutechess.AppImage
          chmod +x /tmp/cutechess.AppImage
          cd /tmp
          /tmp/cutechess.AppImage --appimage-extract
          CUTE_BIN="$(find /tmp/squashfs-root -type f -name 'cutechess-cli' | head -n 1)"
          test -n "$CUTE_BIN"
          echo "CUTECHESS_BIN=$CUTE_BIN" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/tmp/squashfs-root/usr/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          "$CUTE_BIN" --version

      - name: Build NextGen release engine and run correctness tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          mkdir -p bin
          cp build/chess_engine bin/chess_engine
          printf 'uci\nisready\nquit\n' | ./bin/chess_engine | tee engine-uci-smoke.txt
          grep -q 'uciok' engine-uci-smoke.txt
          grep -q 'readyok' engine-uci-smoke.txt

      - name: Install Python PGN parser and generate balanced opening suite
        run: |
          python3 -m pip install --user --break-system-packages python-chess
          cat > /tmp/make_openings.py <<'PY'
          import chess, chess.pgn
          lines = [
              [],
              ["e2e4","e7e5","g1f3","b8c6"],
              ["e2e4","c7c5","g1f3","d7d6"],
              ["e2e4","e7e6","d2d4","d7d5"],
              ["e2e4","c7c6","d2d4","d7d5"],
              ["d2d4","d7d5","c2c4","e7e6"],
              ["d2d4","g8f6","c2c4","e7e6"],
              ["c2c4","e7e5","b1c3","g8f6"],
              ["g1f3","d7d5","d2d4","g8f6"],
              ["e2e4","g8f6","e4e5","f6d5"],
              ["e2e4","e7e5","g1f3","g8f6"],
              ["d2d4","d7d5","c2c4","c7c6"],
              ["e2e4","c7c5","g1f3","b8c6"],
              ["d2d4","g8f6","c2c4","g7g6"],
              ["c2c4","c7c5","g2g3","b8c6"],
              ["e2e4","e7e5","f1c4","g8f6"],
              ["d2d4","d7d5","g1f3","g8f6"],
              ["e2e4","c7c5","b1c3","b8c6"],
              ["e2e4","e7e6","d2d4","d7d5"],
              ["c2c4","e7e5","g2g3","g8f6"],
          ]
          with open("/tmp/elo-openings.pgn","w") as out:
              for seq in lines:
                  game = chess.pgn.Game()
                  board = game.board()
                  node = game
                  for uci in seq:
                      move = chess.Move.from_uci(uci)
                      if move not in board.legal_moves:
                          raise ValueError(f"Illegal opening move {uci}")
                      node = node.add_variation(move)
                      board.push(move)
                  out.write(str(game) + "\n\n")
          print(f"Wrote {len(lines)} legal opening lines")
          PY
          python3 /tmp/make_openings.py

      - name: Download official Stockfish 19
        run: |
          mkdir -p /tmp/sf19
          curl --fail --location --retry 3 \
            https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz \
            --output /tmp/stockfish19.tar.gz
          tar -xzf /tmp/stockfish19.tar.gz -C /tmp/sf19 --strip-components=1
          SF_BIN="$(find /tmp/sf19 -type f -name 'stockfish*' -perm /111 | head -n 1)"
          test -n "$SF_BIN"
          echo "SF_BIN=$SF_BIN" >> "$GITHUB_ENV"
          "$SF_BIN" <<< $'uci\nquit' | grep -E 'id name Stockfish 19|uciok'

      - name: Run Cute Chess match
        env:
          GAMES: ${{ inputs.games }}
          TC: ${{ inputs.tc }}
          SF_ELO: ${{ inputs.sf_elo }}
        run: |
          set -o pipefail
          mkdir -p benchmark-results
          echo "NextGen vs Stockfish 19 UCI_Elo=$SF_ELO | games=$GAMES | tc=$TC" | tee benchmark-results/run-info.txt
          cutechess-cli \
            -engine name=NextGen cmd=./bin/chess_engine proto=uci option.Hash=128 option.Threads=1 \
            -engine name=Stockfish19 cmd="$SF_BIN" proto=uci option.Hash=128 option.Threads=1 option.UCI_LimitStrength=true option.UCI_Elo="$SF_ELO" \
            -each tc="$TC" \
            -rounds 1 -games "$GAMES" -repeat -concurrency 2 \
            -openings file=/tmp/elo-openings.pgn format=pgn order=random \
            -ratinginterval 1 \
            -pgnout benchmark-results/games.pgn \
            2>&1 | tee benchmark-results/cutechess.log

      - name: Calculate performance estimate and confidence interval
        if: always()
        run: |
          python3 -m pip install --user --break-system-packages python-chess
          cat > /tmp/report.py <<'PY'
          import chess.pgn, json, math, os, statistics
          from pathlib import Path
          pgn = Path("benchmark-results/games.pgn")
          games = []
          if pgn.exists():
              with pgn.open(errors="replace") as f:
                  while (g := chess.pgn.read_game(f)) is not None:
                      white, black, result = g.headers.get("White",""), g.headers.get("Black",""), g.headers.get("Result","*")
                      if "NextGen" not in (white, black): continue
                      if result not in ("1-0","0-1","1/2-1/2"): continue
                      if white == "NextGen":
                          score = {"1-0":1.0,"0-1":0.0,"1/2-1/2":0.5}[result]
                      else:
                          score = {"1-0":0.0,"0-1":1.0,"1/2-1/2":0.5}[result]
                      games.append({"white":white,"black":black,"result":result,"score":score,"termination":g.headers.get("Termination","")})
          n = len(games)
          w = sum(x["score"] == 1 for x in games)
          l = sum(x["score"] == 0 for x in games)
          d = sum(x["score"] == 0.5 for x in games)
          s = sum(x["score"] for x in games)/n if n else None
          opp = int(os.environ["SF_ELO"])
          elo = None
          ci = None
          if n and 0 < s < 1:
              elo = opp + 400*math.log10(s/(1-s))
              vals = [x["score"] for x in games]
              se = statistics.stdev(vals)/math.sqrt(n) if n > 1 else 0.5
              lo, hi = max(0.001,s-1.96*se), min(0.999,s+1.96*se)
              ci = [opp+400*math.log10(lo/(1-lo)), opp+400*math.log10(hi/(1-hi))]
          report = {
              "engine":"NextGenChessEngine",
              "opponent":"Stockfish 19",
              "stockfish_uci_elo":opp,
              "time_control_seconds":os.environ["TC"],
              "games_requested":int(os.environ["GAMES"]),
              "games_recorded":n,"wins":w,"draws":d,"losses":l,
              "score":s,"estimated_performance_elo":elo,
              "approx_95_percent_elo_interval":ci,
              "note":"Provisional single-opponent estimate; repeat across multiple Stockfish UCI_Elo levels for a stronger calibrated rating."
          }
          Path("benchmark-results/summary.json").write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
          python3 /tmp/report.py
          cat benchmark-results/summary.json

      - name: Upload PGN, logs and Elo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutechess-elo-benchmark
          path: |
            benchmark-results/
            engine-uci-smoke.txt
          if-no-files-found: warn
          retention-days: 30
