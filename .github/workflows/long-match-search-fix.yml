name: NextGen 50-game Stockfish 19 MAX audit — timed-search fix

on:
  push:
    branches:
      - audit/clock-depth-stop-fix-2026-10-28
    paths:
      - '.github/workflows/long-match-search-fix.yml'
      - 'core/movegen.cpp'
      - 'search/search.cpp'
      - 'tests/test_main.cpp'
  workflow_dispatch:
    inputs:
      games:
        description: "Even number of games, colors paired"
        type: choice
        required: true
        default: "50"
        options: ["10", "20", "50"]

permissions:
  contents: read

concurrency:
  group: nextgen-search-stop-fix-50-game-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GAMES: ${{ inputs.games || '50' }}
      TC: "180+2"
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install C++ and chess tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake
          python -m pip install --upgrade pip
          python -m pip install python-chess
          python -m py_compile tools/clock_match.py tools/analyze_engine_weakness.py tests/test_engine_weakness_audit.py
          python tests/test_engine_weakness_audit.py

      - name: Build engine and run all regression tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          mkdir -p bin
          cp build/chess_engine bin/chess_engine

      - name: Download official Stockfish 19
        run: |
          mkdir -p /tmp/sf19
          curl --fail --location --retry 3 https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz --output /tmp/stockfish19.tar.gz
          tar -xzf /tmp/stockfish19.tar.gz -C /tmp/sf19 --strip-components=1
          STOCKFISH_BIN="$(find /tmp/sf19 -type f -name 'stockfish*' -perm /111 | head -n 1)"
          test -n "$STOCKFISH_BIN"
          ln -sf "$STOCKFISH_BIN" /tmp/sf19/stockfish19
          chmod +x /tmp/sf19/stockfish19
          /tmp/sf19/stockfish19 <<'EOF'
          uci
          quit
          EOF

      - name: Play genuine clock-controlled games (no fixed depth, no book leakage)
        id: match
        run: |
          set +e
          mkdir -p artifacts/long-match
          python tools/clock_match.py \
            --games "$GAMES" \
            --tc "$TC" \
            --sf-elo 0 \
            --hash-mb 256 \
            --tag "search-stop-fix-180plus2-max-no-book" \
            --jsonl artifacts/long-match/match.jsonl \
            --pgn artifacts/long-match/match.pgn \
            --summary artifacts/long-match/match-summary.json \
            --max-ply 240
          match_exit=$?
          set -e
          echo "$match_exit" > artifacts/long-match/match-exit-code.txt
          test -s artifacts/long-match/match.pgn

      - name: Audit the biggest tactical and mating mistakes
        run: |
          python tools/analyze_engine_weakness.py \
            --pgn artifacts/long-match/match.pgn \
            --stockfish /tmp/sf19/stockfish19 \
            --quick-seconds 0.35 \
            --critical-seconds 15 \
            --threshold-cp 120 \
            --top-critical 10 \
            --hash-mb 256 \
            --out artifacts/long-match/weakness-report.json

      - name: Verify match completeness
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/long-match")
          summary_path = root / "match-summary.json"
          exit_path = root / "match-exit-code.txt"
          if not summary_path.is_file() or not exit_path.is_file():
              raise SystemExit("Missing match summary or exit code.")
          summary = json.loads(summary_path.read_text())
          exit_code = int(exit_path.read_text().strip())
          requested = int(__import__("os").environ["GAMES"])
          if exit_code != 0 or summary.get("games") != requested or summary.get("discarded", 0) != 0:
              raise SystemExit(f"Incomplete match: exit={exit_code}, summary={summary}")
          if not (root / "weakness-report.json").is_file():
              raise SystemExit("Weakness analysis did not produce a report.")
          print(json.dumps(summary, indent=2))
          PY

      - name: Publish run summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path("artifacts/long-match")
          out = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with out.open("a", encoding="utf-8") as f:
              f.write("# NextGen vs Stockfish 19 MAX — timed-search fix audit\n\n")
              summary_path = root / "match-summary.json"
              if summary_path.is_file():
                  s = json.loads(summary_path.read_text())
                  f.write(f"- **Result:** {s.get('wins')} wins, {s.get('draws')} draws, {s.get('losses')} losses\n")
                  f.write(f"- **Games:** {s.get('games')} / {s.get('requested_games')} requested; discarded: {s.get('discarded')}\n")
                  f.write(f"- **Time control:** {s.get('time_control_seconds')}+{s.get('increment_seconds')} seconds per side\n")
                  f.write(f"- **Depth limit passed:** {s.get('depth_limit_passed')} (false means clock-managed iterative deepening)\n")
                  f.write(f"- **Equal resources:** {s.get('threads_each')} thread(s), {s.get('hash_mb_each')} MB hash each; experience book: {s.get('experience_book_enabled')}\n\n")
              report_path = root / "weakness-report.json"
              if report_path.is_file():
                  r = json.loads(report_path.read_text())
                  f.write("## Mistake audit\n\n")
                  f.write(f"- NextGen moves scanned: {r.get('nextgen_moves_scanned')}\n")
                  f.write(f"- Apparent mistakes at or above {r.get('threshold_cp')} cp: {r.get('apparent_mistakes_at_or_above_threshold')}\n")
                  f.write(f"- Deep positions completed: {r.get('deep_positions_completed')}\n\n")
                  f.write("| Phase | Moves | Mean cp loss | 300+ cp | 800+ cp |\n|---|---:|---:|---:|---:|\n")
                  for phase, row in r.get("summary_by_phase", {}).items():
                      f.write(f"| {phase} | {row.get('moves')} | {row.get('mean_cp_loss')} | {row.get('cp_loss_300_plus')} | {row.get('cp_loss_800_plus')} |\n")
          PY

      - name: Upload complete or partial match artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextgen-search-stop-fix-long-match-180plus2-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: artifacts/long-match/

# Re-run marker: identical combined SEE + timed-search engine sources.
